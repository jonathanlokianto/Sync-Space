name: Sync Space CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # BACK-END
  backend-tests:
    name: Backend (Go) Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Respository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Install Go Dependencies
        run: |
          cd backend
          go mod download

      - name: Run Backend Tests
        run: |
          cd backend
          go test -v ./...

      - name: Verify Backend Build
        run: |
          cd backend/cmd/api
          go build -v .

  # FRONT-END
  frontend-tests:
    name: Frontend (Next.JS) Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Respository
        uses: actions/checkout@v4

      - name: Setup Node.JS Environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Frontend Linter
        run: |
          cd frontend
          npm run lint

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.syncspace.local
